[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ustb-chat2api"
version = "2.0.0"
description = "北科大 AI 助手 OpenAI 兼容 API 网关 - 工具调用桥"
authors = [{ name = "yhcps" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "requests>=2.31",
    "websocket-client>=1.7",
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.scripts]
ustb-chat2api = "ustb_chat2api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
